services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketpulse
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: ${MARKETPULSE_PG_PASSWORD:?Set MARKETPULSE_PG_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - blackboard:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  blackboard:
