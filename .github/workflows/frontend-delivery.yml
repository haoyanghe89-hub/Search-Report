name: Frontend and container delivery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev,web,server]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest tests/unit tests/integration -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Verify API proxy and frontend
        run: |
          curl --fail http://localhost:3000/healthz
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:3000/
      - if: always()
        run: docker compose logs --no-color && docker compose down
