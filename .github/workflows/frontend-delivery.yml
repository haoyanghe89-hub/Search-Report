name: Frontend and container delivery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev,web,server]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest tests/unit tests/integration -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Verify API proxy and frontend
        run: |
          curl --fail http://localhost:3000/healthz
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:3000/
      - name: Verify paired PostgreSQL and Blob recovery with offline evidence
        run: |
          curl --fail --max-time 300 -X POST http://localhost:3000/api/cases/east-palestine-2023/replay
          docker compose --profile ops build ops
          docker compose --profile ops run --rm ops backup --blob-root /data/blobs --destination /backups/ci-paired
          docker compose --profile ops run --rm ops verify --archive /backups/ci-paired
          docker compose --profile ops run --rm ops drill --archive /backups/ci-paired --destination /restore-drills/ci-paired --postgres-admin-url-env MARKETPULSE_DATABASE_URL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-recovery-drill
          path: restore-drills/ci-paired/restore-report.json
          if-no-files-found: ignore
      - if: always()
        run: docker compose logs --no-color && docker compose down
