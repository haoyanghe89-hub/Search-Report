services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketpulse
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: ${MARKETPULSE_PG_PASSWORD:-marketpulse-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MARKETPULSE_DATABASE_URL: postgresql+psycopg://marketpulse:${MARKETPULSE_PG_PASSWORD:-marketpulse-local}@postgres:5432/marketpulse
      INVESTIGATION_API_HOST: 0.0.0.0
      INVESTIGATION_API_PORT: 8000
      INVESTIGATION_BLOB_ROOT: /data/blobs
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      MARKETPULSE_MODEL: ${MARKETPULSE_MODEL:-deepseek-flash}
      MARKETPULSE_THINKING_ENABLED: ${MARKETPULSE_THINKING_ENABLED:-false}
      MARKETPULSE_TOTAL_TIMEOUT_SECONDS: ${MARKETPULSE_TOTAL_TIMEOUT_SECONDS:-3600}
      MARKETPULSE_MAX_SEARCH_QUERIES: ${MARKETPULSE_MAX_SEARCH_QUERIES:-240}
      MARKETPULSE_MAX_PAGES: ${MARKETPULSE_MAX_PAGES:-600}
      MARKETPULSE_MAX_RESEARCH_ROUNDS: ${MARKETPULSE_MAX_RESEARCH_ROUNDS:-6}
      MARKETPULSE_RESEARCH_WORKERS: ${MARKETPULSE_RESEARCH_WORKERS:-4}
      MARKETPULSE_SEARCH_CONCURRENCY: ${MARKETPULSE_SEARCH_CONCURRENCY:-4}
      MARKETPULSE_FETCH_CONCURRENCY: ${MARKETPULSE_FETCH_CONCURRENCY:-8}
      MARKETPULSE_QUERIES_PER_RESEARCHER: ${MARKETPULSE_QUERIES_PER_RESEARCHER:-3}
      MARKETPULSE_MAX_MODEL_CALLS: ${MARKETPULSE_MAX_MODEL_CALLS:-480}
      MARKETPULSE_MAX_TOKENS: ${MARKETPULSE_MAX_TOKENS:-2000000}
      MARKETPULSE_PAGE_TIMEOUT_SECONDS: ${MARKETPULSE_PAGE_TIMEOUT_SECONDS:-15}
      MARKETPULSE_ALLOW_PROXY_DNS: ${MARKETPULSE_ALLOW_PROXY_DNS:-false}
      REVIEWER_ID: ${REVIEWER_ID:-}
      REVIEWER_DISPLAY_NAME: ${REVIEWER_DISPLAY_NAME:-}
      REVIEWER_PASSWORD_HASH: ${REVIEWER_PASSWORD_HASH:-}
      REVIEW_RATE_LIMIT_FINGERPRINT_SECRET: ${REVIEW_RATE_LIMIT_FINGERPRINT_SECRET:-}
      REVIEW_SESSION_TTL_HOURS: ${REVIEW_SESSION_TTL_HOURS:-8}
      REVIEW_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      REVIEW_ALLOW_INSECURE_LOOPBACK: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - blob-data:/data/blobs

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"

volumes:
  postgres-data:
  blob-data:
